spring:
  task:
    scheduling:
      enabled: false
  datasource:
    url: jdbc:h2:mem:tbh_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

tbh:
  scheduling:
    enabled: false
  otp:
    provider: mock
  payment:
    provider: mock
  kyc:
    provider: mock
  jwt:
    secret: "tbh-test-environment-jwt-secret-key-for-unit-testing-purposes-only-32bytes"
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  security:
    allowed-origins: "http://localhost:5173,http://localhost:3000"
