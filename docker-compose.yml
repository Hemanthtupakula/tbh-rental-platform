services:
  # ----------------------------------------------------------------------------
  # 1. MySQL 8 Relational Database Service
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: tbh-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-tbh}
      MYSQL_USER: ${MYSQL_USER:-tbh_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-tbhpassword123}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${DB_PASSWORD:-rootpassword123}}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - tbh-network

  # ----------------------------------------------------------------------------
  # 2. Redis 7 Cache & Infrastructure Service (Internal Network Only)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: tbh-redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - tbh-network

  # ----------------------------------------------------------------------------
  # 3. Spring Boot Backend API Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tbh-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${DOCKER_SPRING_PROFILES_ACTIVE:-prod}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-tbh}
      DB_USER: ${DB_USER:-tbh_user}
      DB_PASSWORD: ${DB_PASSWORD:-tbhpassword123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TBH_JWT_SECRET: ${TBH_JWT_SECRET:-tbh-ride-beyond-limits-super-secret-key-2026-production-grade-encryption}
      TBH_OTP_PROVIDER: ${TBH_OTP_PROVIDER:-mock}
      TBH_PAYMENT_PROVIDER: ${TBH_PAYMENT_PROVIDER:-mock}
      TBH_KYC_PROVIDER: ${TBH_KYC_PROVIDER:-mock}
      TBH_EMAIL_PROVIDER: ${TBH_EMAIL_PROVIDER:-mock}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      TBH_ALLOWED_ORIGINS: ${TBH_ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:3000,http://localhost:5173,http://127.0.0.1}
      IMAGEKIT_URL_ENDPOINT: ${IMAGEKIT_URL_ENDPOINT:-https://ik.imagekit.io/hemanthhkt}
      IMAGEKIT_PUBLIC_KEY: ${IMAGEKIT_PUBLIC_KEY:-public_NS0dUSt2SSRtcWhuLkyPHEKUjz0=}
      IMAGEKIT_PRIVATE_KEY: ${IMAGEKIT_PRIVATE_KEY:-}
      IMAGEKIT_ID: ${IMAGEKIT_ID:-hemanthhkt}
      CLERK_ISSUER: ${CLERK_ISSUER:-https://deep-zebra-6151.clerk.accounts.dev}
      CLERK_JWKS_URI: ${CLERK_JWKS_URI:-https://deep-zebra-6151.clerk.accounts.dev/.well-known/jwks.json}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-pk_test_ZGVlcC16ZWJyYS02MTUxLmNsZXJrLmFjY291bnRzLmRldiQ}
      TESSERACT_CMD: ${TESSERACT_CMD:-/usr/bin/tesseract}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - tbh-network

  # ----------------------------------------------------------------------------
  # 4. React / Vite Nginx Frontend Service
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-pk_test_ZGVlcC16ZWJyYS02MTUxLmNsZXJrLmFjY291bnRzLmRldiQ}
    container_name: tbh-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - tbh-network

networks:
  tbh-network:
    name: tbh-network
    driver: bridge

volumes:
  mysql_data:
    name: tbh_mysql_data
